services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  ai-service:
    build: ./ai-service
    ports: ["8000:8000"]
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports: ["4000:4000"]
    depends_on: [mongo, ai-service]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  mongo_data:
